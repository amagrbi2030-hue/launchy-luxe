name: Build Launchy Luxe

# Builds the Android APK and publishes the website.
# Works whether you upload launchy-luxe.zip (easiest from a phone) or the extracted files.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: launchy-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare sources
        run: |
          mkdir -p work
          ZIP=$(ls -1 *.zip 2>/dev/null | head -n 1 || true)
          if [ -n "$ZIP" ]; then
            echo "Using $ZIP"
            unzip -q -o "$ZIP" -d work
          else
            rsync -a --exclude work --exclude .git ./ work/
          fi
          test -f work/index.html && test -d work/android || { echo "::error::لم أجد index.html ومجلد android — ارفع launchy-luxe.zip كما هو"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Put the studio inside the app
        run: |
          mkdir -p work/android/app/src/main/assets/web
          cp work/index.html work/manifest.webmanifest work/icon.svg work/icon-192.png work/icon-512.png work/android/app/src/main/assets/web/

      - name: Build APK
        working-directory: work/android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Publish APK (Releases → apk-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp work/android/app/build/outputs/apk/release/app-release.apk LaunchyLuxe.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest LaunchyLuxe.apk \
            --title "Launchy Luxe — أحدث نسخة APK" \
            --notes "بُنيت تلقائياً. على الهاتف: نزّل LaunchyLuxe.apk ثم افتحه للتثبيت." \
            --latest

      - uses: actions/upload-artifact@v4
        with:
          name: LaunchyLuxe-apk
          path: LaunchyLuxe.apk

      - name: Prepare website
        run: |
          mkdir -p site
          cp work/index.html work/manifest.webmanifest work/sw.js work/icon.svg work/icon-*.png site/
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  website:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
